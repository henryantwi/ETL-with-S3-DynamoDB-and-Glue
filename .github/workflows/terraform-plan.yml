name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write       # OIDC token for AWS role assumption
  contents: read
  pull-requests: write  # post the plan as a PR comment

env:
  AWS_REGION: eu-west-1
  TF_BACKEND_BUCKET: terraform-state-559050223770
  # Required tf vars (terraform.tfvars is gitignored). Account id is not secret.
  TF_VAR_bucket_suffix: ${{ vars.BUCKET_SUFFIX }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend-config="bucket=${{ env.TF_BACKEND_BUCKET }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        # Write the binary plan, then render to text separately so a plan
        # failure fails the step (piping to tee would mask terraform's exit code).
        run: |
          terraform plan -no-color -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n...truncated...';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform Plan\n```\n' + plan + '\n```',
            });
