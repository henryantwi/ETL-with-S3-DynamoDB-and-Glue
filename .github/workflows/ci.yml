name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # OIDC token for AWS role assumption
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_BACKEND_BUCKET: terraform-state-559050223770
  # Required tf vars (terraform.tfvars is gitignored). Account id is not secret.
  TF_VAR_bucket_suffix: ${{ vars.BUCKET_SUFFIX }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run unit tests
        run: uv run pytest tests/ -v

      - name: Validate Step Functions definition
        run: uv run python -c "import json; json.load(open('step_functions/etl_pipeline.asl.json'))"

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"   # backend requires >= 1.6

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend-config="bucket=${{ env.TF_BACKEND_BUCKET }}"

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Plan
        run: terraform -chdir=terraform plan -input=false -no-color

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # supplies the OIDC identity the deploy role trusts
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"   # backend requires >= 1.6

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend-config="bucket=${{ env.TF_BACKEND_BUCKET }}"

      - name: Terraform Apply
        # Glue scripts upload implicitly via aws_s3_object resources (filemd5
        # etags) during apply — no separate packaging/upload step needed.
        run: terraform -chdir=terraform apply -auto-approve -input=false
