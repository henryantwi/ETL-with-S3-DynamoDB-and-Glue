name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-py312:
    # All tests except the Spark suite (pure Python + moto).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run pytest tests --ignore=tests/unit/genre_metrics -q

  test-spark:
    # pyspark 3.5.1 needs Python <=3.11 and a JDK. The project targets >=3.12,
    # so install pyspark into a standalone 3.11 venv (bypasses the project's
    # requires-python) and run only the Spark suite there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv venv --python 3.11 .venv-ci
      - run: uv pip install --python .venv-ci pyspark==3.5.1 pytest boto3 pyarrow "moto[dynamodb,s3]"
      - run: uv run --no-project --python .venv-ci pytest tests/unit/genre_metrics -q
