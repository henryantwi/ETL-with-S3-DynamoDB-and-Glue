[project]
name = "secure-storage-foundation"
version = "0.1.0"
description = "Phase 1 ETL infrastructure smoke tests"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.34",
    "pytest>=8.0",
    "moto[s3]>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["smoke_test_*.py", "test_*.py"]
