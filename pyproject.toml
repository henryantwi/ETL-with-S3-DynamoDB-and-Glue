[project]
name = "music-streaming-etl"
version = "0.2.0"
description = "Music streaming ETL pipeline — S3, Glue, Step Functions"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.34",
    "pyarrow>=14.0",
    "pytest>=8.0",
    "moto[dynamodb,s3]>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["scripts", "glue_jobs", "tests"]
python_files = ["smoke_test_*.py", "test_*.py"]
