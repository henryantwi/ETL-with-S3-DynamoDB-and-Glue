[project]
name = "music-streaming-etl"
version = "0.2.0"
description = "Music streaming ETL pipeline — S3, Glue, Step Functions"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.34",
    "pyarrow>=14.0",
    "pytest>=8.0",
    "moto[dynamodb,s3]>=5.0",
    "ruff>=0.6",
    # pyspark 3.5.1 requires Python <=3.11, so the project targets 3.11 and the
    # single CI lint-and-test job runs on 3.11 with a JDK (see ci.yml).
    "pyspark==3.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["smoke_test_*.py", "test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv-spark", "data"]

[tool.ruff.lint]
# Lenient initial ruleset: pycodestyle errors/warnings, pyflakes, import sort.
# Tighten over time.
select = ["E", "F", "W", "I"]
ignore = ["E501"]
